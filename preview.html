<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ciao Energy Preview</title>
<link rel="stylesheet" href="./assets/ciao.css">
<script type="importmap">
{"imports":{"three":"./assets/three.module.js"}}
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171717;color:white;font-family:Arial,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.65}
.shade{position:fixed;inset:0;background:linear-gradient(90deg,#0009,transparent)}
header{position:absolute;top:22px;left:25px;z-index:3;font-size:25px;font-weight:900}
.info{position:absolute;left:25px;bottom:45px;z-index:3}
h1{font-size:clamp(38px,8vw,76px);margin:0 0 12px}
p{font-size:17px}
select{padding:12px;border:0;border-radius:8px}
#model{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#status{position:absolute;right:12px;bottom:12px;z-index:4;background:#000b;padding:8px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<video id="bg" autoplay muted loop playsinline>
<source src="./assets/videos/coco-citron.mp4" type="video/mp4">
</video>
<div class="shade"></div>
<header>CIAO ENERGY</header>
<canvas id="model"></canvas>
<div class="info">
<h1>ENERGY, WITH A TWIST.</h1>
<p>Choose your flavour</p>
<select id="flavour">
<option value="coco-citron">Coco Citron</option>
<option value="framboise">Framboise</option>
<option value="kiwi-concombre">Kiwi Concombre</option>
<option value="peche-blanche">Pêche Blanche</option>
<option value="pomme-rhubarbe">Pomme Rhubarbe</option>
</select>
</div>
<div id="status">Loading 3D model...</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './assets/GLTFLoader.js';

const canvas=document.querySelector('#model');
const status=document.querySelector('#status');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,5);
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));
const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(3,4,5);
scene.add(light);

new GLTFLoader().load('./assets/models/can.glb',g=>{
 const can=g.scene;
 const box=new THREE.Box3().setFromObject(can);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());
 can.position.sub(center);
 can.scale.setScalar(2.2/Math.max(size.x,size.y,size.z));
 can.position.x=1.15;
 scene.add(can);
 status.textContent='3D model loaded';
 function animate(){
  requestAnimationFrame(animate);
  can.rotation.y+=0.006;
  renderer.render(scene,camera);
 }
 animate();
},undefined,e=>{
 status.textContent='3D model could not load; background preview still available';
 console.error(e);
});

document.querySelector('#flavour').addEventListener('change',e=>{
 document.querySelector('#bg').src='./assets/videos/'+e.target.value+'.mp4';
 document.querySelector('#bg').play().catch(()=>{});
});
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
